<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXE - Luxury Fashion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#f5f5f5;font-family:'Helvetica Neue',Arial,sans-serif}
header{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-size:28px;font-weight:900;letter-spacing:4px}
nav a{color:#fff;text-decoration:none;margin-left:24px;opacity:.7}
.hero{height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;background:radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 70%)}
.hero h1{font-size:72px;letter-spacing:8px;font-weight:900;margin-bottom:20px}
.hero p{font-size:18px;opacity:.6;letter-spacing:2px;margin-bottom:30px}
.btn{padding:14px 32px;border:1px solid #fff;background:transparent;color:#fff;letter-spacing:3px;cursor:pointer}
.btn:hover{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#222;padding:1px}
.card{background:#111;overflow:hidden}
.card img{width:100%;height:420px;object-fit:cover;display:block;transition:.5s}
.card:hover img{transform:scale(1.05)}
.card-info{padding:18px}
.card-info h3{font-size:14px;letter-spacing:2px;margin-bottom:6px}
.card-info span{opacity:.5;font-size:13px}
footer{padding:60px 40px;text-align:center;opacity:.4;letter-spacing:2px;font-size:12px;border-top:1px solid #222;margin-top:40px}
</style>
</head>
<body>
<header>
<div class="logo">LUXE</div>
<nav><a href="#">NEW</a><a href="#">WOMEN</a><a href="#">MEN</a><a href="#">COLLECTION</a></nav>
</header>
<div class="hero">
<div>
<h1>LUXE LIFE</h1>
<p>TIMELESS LUXURY • MODERN ELEGANCE</p>
<button class="btn">EXPLORE COLLECTION</button>
</div>
</div>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=600"><div class="card-info"><h3>SILK DRESS NOIR</h3><span>$890</span></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=600"><div class="card-info"><h3>WOOL COAT ECLIPSE</h3><span>$1,250</span></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=600"><div class="card-info"><h3>LEATHER BAG LUXE</h3><span>$670</span></div></div>
</div>
<footer>© 2026 LUXE LIFE MAGAZINE • TIMELESS LUXURY</footer>
</body>
</html>
